---
name: OpenCode Review Threads
description: Run OpenCode in GitHub Actions with structured pull request reviews and resolvable inline threads
branding:
  icon: square
  color: black
inputs:
  model:
    required: false
    description: >-
      Model to use, in provider/model format. When empty, the action probes the
      models-review or models-fix chain (chosen by task type) and selects the
      first reachable entry instead.
    default: ""
  models-review:
    required: false
    description: >-
      Comma-separated probe chain used for review runs (pull_request triggers,
      /review-pr prompts, and `/oc review` comments). Entries: <prefix>:<model>
      probes the provider's endpoint before selecting (prefixes: cf, zen, zengo,
      anthropic, openai, openrouter, google, groq, mistral, deepseek, xai,
      cerebras, moonshotai, github-copilot), while a bare provider/model is
      selected without probing. Required when `model` is empty; no chains are
      bundled, so model selection is always an explicit caller choice.
    default: ""
  models-fix:
    required: false
    description: >-
      Comma-separated probe chain used for non-review runs. Same entry syntax
      as models-review. Required when `model` is empty and a non-review run is
      triggered.
    default: ""
  guard-path-leaks:
    required: false
    description: >-
      Whether to snapshot PR comments before the run and fail the job when a
      comment posted by this run contains a leaked `@/` or `/tmp/` path token.
    default: "true"
  job-started-at:
    required: false
    description: >-
      Epoch (seconds) when the job started, used to anchor the shared agent
      deadline. Defaults to the moment the run step begins.
    default: ""
  agent:
    required: false
    description: Agent to use as the run's default_agent. A slash command's frontmatter agent takes precedence.
    default: build
  share:
    required: false
    description: Whether to share the opencode session
    default: "false"
  prompt:
    required: false
    description: Custom prompt to override the default prompt. Leading Markdown slash commands are expanded before opencode github run.
    default: ""
  use-github-token:
    required: false
    description: Whether to use GITHUB_TOKEN directly instead of OpenCode App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var.
    default: "false"
  mentions:
    required: false
    description: Comma-separated list of trigger phrases (case-insensitive)
    default: /opencode,/oc
  variant:
    required: false
    description: >-
      Model variant for provider-specific reasoning effort (e.g., high, max, minimal).
      Empty runs every model with its default configuration. The action rejects a nonempty value only when its bundled model registry is known to be authoritative; otherwise the requested variant is passed through unchanged for OpenCode/provider validation.
    default: ""
  oidc-base-url:
    required: false
    description: Base URL for OIDC token exchange API. Only required when running a custom GitHub App install.
    default: https://api.opencode.ai
  opencode-version:
    required: false
    description: OpenCode version to install (e.g., v1.2.3)
    default: latest
  use-bundled-toolkit:
    required: false
    description: Whether to use the action's bundled .opencode/ agents, commands, skills, and supporting configuration.
    default: "true"
  timeout-minutes:
    required: false
    description: Maximum minutes to let 'opencode github run' execute before it is killed (uses 'timeout'/'gtimeout' when available; otherwise runs without an enforced timeout).
    default: "60"
outputs:
  opencode-version:
    description: OpenCode version resolved for this run.
    value: ${{ steps.version.outputs.opencode-version }}
  model:
    description: Model selected for this run (the `model` input or the first reachable probe-chain entry).
    value: ${{ steps.probe.outputs.model || inputs.model }}
  cache-hit:
    description: Whether the OpenCode binary cache was restored. Empty for review-only runs, which always skip the cache and install fresh to avoid restoring a binary directory poisoned by prior runner state.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Get OpenCode version
      id: version
      shell: bash -euo pipefail {0}
      env:
        INPUT_VERSION: ${{ inputs.opencode-version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [[ "${INPUT_VERSION}" == "latest" ]]; then
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then
            auth_header=(-H "Authorization: token ${GITHUB_TOKEN}")
          else
            auth_header=()
          fi
          OPENCODE_VERSION="$(curl -fsSL "${auth_header[@]}" https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name')"
        else
          OPENCODE_VERSION="${INPUT_VERSION}"
        fi
        OPENCODE_VERSION="${OPENCODE_VERSION#v}"
        echo "opencode-version=${OPENCODE_VERSION}" | tee -a "${GITHUB_OUTPUT}"
    - name: Detect review-only mode
      id: review_mode
      shell: bash -euo pipefail {0}
      env:
        PROMPT: ${{ inputs.prompt }}
        MENTIONS: ${{ inputs.mentions }}
        USE_BUNDLED_TOOLKIT: ${{ inputs.use-bundled-toolkit }}
        OPENCODE_VERSION: ${{ steps.version.outputs.opencode-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: >
        "${ACTION_PATH}/scripts/detect-review-mode.sh"
    - name: Copy bundled OpenCode config
      if: inputs.use-bundled-toolkit == 'true'
      shell: bash -euo pipefail {0}
      env:
        ACTION_PATH: ${{ github.action_path }}
        REVIEW_ONLY: ${{ steps.review_mode.outputs.enabled }}
      run: >
        "${ACTION_PATH}/scripts/prepare-opencode-config.sh"
    - name: Select model and emit OpenCode config
      id: probe
      shell: bash -euo pipefail {0}
      env:
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
        MENTIONS: ${{ inputs.mentions }}
        MODELS_REVIEW: ${{ inputs.models-review }}
        MODELS_FIX: ${{ inputs.models-fix }}
        USE_BUNDLED_TOOLKIT: ${{ inputs.use-bundled-toolkit }}
        ACTION_PATH: ${{ github.action_path }}
      run: >
        "${ACTION_PATH}/scripts/probe-model.sh"
    - name: Cache OpenCode
      id: cache
      if: steps.review_mode.outputs.enabled != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.opencode-version }}
    - name: Install OpenCode
      if: >
        steps.cache.outputs.cache-hit != 'true'
      shell: bash -euo pipefail {0}
      env:
        OPENCODE_VERSION: ${{ steps.version.outputs.opencode-version }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
        ACTION_PATH: ${{ github.action_path }}
      run: >
        "${ACTION_PATH}/scripts/install-opencode.sh"
    - name: Add OpenCode to PATH
      shell: bash -euo pipefail {0}
      run: > # zizmor: ignore[github-env] fixed path, not attacker-controlled
        echo "${HOME}/.opencode/bin" | tee -a "${GITHUB_PATH}"
    - name: Snapshot PR comments before agent run
      if: inputs.guard-path-leaks == 'true'
      shell: bash -euo pipefail {0}
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUM: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
        GH_TOKEN: ${{ env.GH_TOKEN || env.GITHUB_TOKEN || '' }}
        ACTION_PATH: ${{ github.action_path }}
      run: >
        "${ACTION_PATH}/scripts/comment-guard.sh" snapshot
    - name: Run OpenCode
      id: run_opencode
      shell: bash -euo pipefail {0}
      env:
        MODEL: ${{ steps.probe.outputs.model || inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use-github-token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc-base-url }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        OPENCODE_VERSION: ${{ steps.version.outputs.opencode-version }}
        ACTION_PATH: ${{ github.action_path }}
        USE_BUNDLED_TOOLKIT: ${{ inputs.use-bundled-toolkit }}
        REVIEW_ONLY: ${{ steps.review_mode.outputs.enabled }}
        JOB_STARTED_AT: ${{ inputs.job-started-at }}
        GH_TOKEN: ${{ env.GH_TOKEN || env.GITHUB_TOKEN || '' }}
      run: >
        "${ACTION_PATH}/scripts/run-with-retry.sh"
    - name: Remove no-findings review comments
      if: success() && inputs.guard-path-leaks == 'true'
      shell: bash -euo pipefail {0}
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUM: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
        GH_TOKEN: ${{ env.GH_TOKEN || env.GITHUB_TOKEN || '' }}
        ACTION_PATH: ${{ github.action_path }}
        USE_GITHUB_TOKEN: ${{ inputs.use-github-token }}
      run: >
        "${ACTION_PATH}/scripts/comment-guard.sh" suppress-clean
    - name: Guard against leaked path tokens
      if: always() && inputs.guard-path-leaks == 'true'
      shell: bash -euo pipefail {0}
      env:
        REPOSITORY: ${{ github.repository }}
        PR_NUM: ${{ github.event.issue.number || github.event.pull_request.number || '' }}
        GH_TOKEN: ${{ env.GH_TOKEN || env.GITHUB_TOKEN || '' }}
        ACTION_PATH: ${{ github.action_path }}
        USE_GITHUB_TOKEN: ${{ inputs.use-github-token }}
      run: >
        "${ACTION_PATH}/scripts/comment-guard.sh" verify
