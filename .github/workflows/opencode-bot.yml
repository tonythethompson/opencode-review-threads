---
name: OpenCode bot
on:
  workflow_call:
    inputs:
      model:
        required: false
        type: string
        description: Model to use with OpenCode; empty probes the models chain
        default: ''
      agent:
        required: false
        type: string
        description: Primary agent to use
        default: build
      share:
        required: false
        type: boolean
        description: Share the OpenCode session
        default: false
      prompt:
        required: false
        type: string
        description: Custom prompt to override the event comment
        default: ''
      use-github-token:
        required: false
        type: boolean
        description: Use GITHUB_TOKEN directly instead of OpenCode App token exchange
        default: false
      mentions:
        required: false
        type: string
        description: Comma-separated list of trigger phrases
        default: /opencode,/oc
      variant:
        required: false
        type: string
        description: Provider-specific model variant
        default: ''
      oidc-base-url:
        required: false
        type: string
        description: Base URL for OIDC token exchange
        default: https://api.opencode.ai
      opencode-version:
        required: false
        type: string
        description: OpenCode version to install
        default: latest
      use-bundled-toolkit:
        required: false
        type: boolean
        description: Use the action's bundled OpenCode toolkit
        default: true
      timeout-minutes:
        required: false
        type: number
        description: Maximum minutes to let OpenCode run
        default: 60
      models-review:
        required: false
        type: string
        description: "Comma-separated model probe chain for review runs (<prefix>:<model> probes; bare provider/model is trusted). Required when model is empty."
        default: ""
      models-fix:
        required: false
        type: string
        description: Comma-separated model probe chain for non-review runs. Required when model is empty.
        default: ""
      guard-path-leaks:
        required: false
        type: boolean
        description: Fail the job when a posted comment leaks a file path token
        default: true
      setup-commands:
        required: false
        type: string
        description: Shell commands run after checkout to install the repo toolchain
        default: ''
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
    secrets:
      ANTHROPIC_API_KEY:
        required: false
        description: Anthropic API key
      OPENAI_API_KEY:
        required: false
        description: OpenAI API key
      OPENROUTER_API_KEY:
        required: false
        description: OpenRouter API key
      OPENCODE_API_KEY:
        required: false
        description: OpenCode API key
      GOOGLE_GENERATIVE_AI_API_KEY:
        required: false
        description: Google Generative AI API key
      DEEPSEEK_API_KEY:
        required: false
        description: DeepSeek API key
      XAI_API_KEY:
        required: false
        description: xAI API key
      GROQ_API_KEY:
        required: false
        description: Groq API key
      CEREBRAS_API_KEY:
        required: false
        description: Cerebras API key
      MOONSHOT_API_KEY:
        required: false
        description: Moonshot AI API key
      MISTRAL_API_KEY:
        required: false
        description: Mistral API key
      GH_TOKEN:
        required: false
        description: GitHub token for repository access
      CLOUDFLARE_ACCOUNT_ID:
        required: false
        description: Cloudflare account ID for Workers AI probe-chain models
      CLOUDFLARE_API_TOKEN:
        required: false
        description: Cloudflare API token for Workers AI probe-chain models
      CLOUDFLARE_API_KEY:
        required: false
        description: Cloudflare credential OpenCode's cloudflare-workers-ai provider reads at runtime; defaults to CLOUDFLARE_API_TOKEN
      CONTEXT7_API_KEY:
        required: false
        description: Context7 API key for the bundled MCP server
  workflow_dispatch:  # checkov:skip=CKV_GHA_7: Parameterized manual dispatch is an intentional trusted-operator interface.
    inputs:
      model:
        required: false
        type: string
        description: Model to use with OpenCode; empty probes the models chain
        default: ''
      agent:
        required: false
        type: string
        description: Primary agent to use
        default: build
      share:
        required: false
        type: boolean
        description: Share the OpenCode session
        default: false
      prompt:
        required: false
        type: string
        description: Custom prompt to override the event comment
        default: ''
      use-github-token:
        required: false
        type: boolean
        description: Use GITHUB_TOKEN directly instead of OpenCode App token exchange
        default: false
      mentions:
        required: false
        type: string
        description: Comma-separated list of trigger phrases
        default: /opencode,/oc
      variant:
        required: false
        type: string
        description: Provider-specific model variant
        default: ''
      oidc-base-url:
        required: false
        type: string
        description: Base URL for OIDC token exchange
        default: https://api.opencode.ai
      opencode-version:
        required: false
        type: string
        description: OpenCode version to install
        default: latest
      use-bundled-toolkit:
        required: false
        type: boolean
        description: Use the action's bundled OpenCode toolkit
        default: true
      timeout-minutes:
        required: false
        type: number
        description: Maximum minutes to let OpenCode run
        default: 60
      models-review:
        required: false
        type: string
        description: "Comma-separated model probe chain for review runs (<prefix>:<model> probes; bare provider/model is trusted). Required when model is empty."
        default: ""
      models-fix:
        required: false
        type: string
        description: Comma-separated model probe chain for non-review runs. Required when model is empty.
        default: ""
      guard-path-leaks:
        required: false
        type: boolean
        description: Fail the job when a posted comment leaks a file path token
        default: true
      setup-commands:
        required: false
        type: string
        description: Shell commands run after checkout to install the repo toolchain
        default: ''
      runs-on:
        required: false
        type: string
        description: Runner to use
        default: ubuntu-latest
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created
permissions:
  contents: read
jobs:
  admission:
    if: >
      (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name != 'issue_comment'
        && github.event_name != 'pull_request_review_comment'
        && inputs.prompt != ''
      )
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    permissions:
      contents: read
    outputs:
      admitted: ${{ steps.mention.outputs.admitted }}
    steps:
      - name: Check configured comment mentions
        id: mention
        shell: bash
        env:
          MENTIONS: ${{ inputs.mentions || '/opencode,/oc' }}
          HAS_MODEL_AND_PROMPT: ${{ inputs.model != '' && inputs.prompt != '' }}
        run: |
          admitted=true
          if [[ "${GITHUB_EVENT_NAME}" == issue_comment || "${GITHUB_EVENT_NAME}" == pull_request_review_comment ]]; then
            # Keep this matcher identical to scripts/opencode-action-lib.sh.
            # shellcheck disable=SC2034
            opencode_find_mention() {
              local body="${1:-}" mentions="${2:-}"
              local lower_body raw_mention mention lower_mention remaining before after
              local index offset
              local -a mention_values
              OPENCODE_MENTION_INDEX=-1
              OPENCODE_MENTION_LENGTH=0
              lower_body="$(printf '%s' "${body}" | tr '[:upper:]' '[:lower:]')"
              IFS=',' read -r -a mention_values <<< "${mentions}"
              for raw_mention in "${mention_values[@]}"; do
                mention="${raw_mention#"${raw_mention%%[![:space:]]*}"}"
                mention="${mention%"${mention##*[![:space:]]}"}"
                [[ -n "${mention}" ]] || continue
                lower_mention="$(printf '%s' "${mention}" | tr '[:upper:]' '[:lower:]')"
                remaining="${lower_body}"
                offset=0
                while [[ "${remaining}" == *"${lower_mention}"* ]]; do
                  before="${remaining%%"${lower_mention}"*}"
                  index=$((offset + ${#before}))
                  after=$((index + ${#mention}))
                  if { ((index == 0)) || [[ "${lower_body:index-1:1}" == [[:space:]] ]]; } \
                    && { ((after == ${#lower_body})) || [[ "${lower_body:after:1}" == [[:space:]] ]]; }; then
                    if ((OPENCODE_MENTION_INDEX < 0 || index < OPENCODE_MENTION_INDEX)); then
                      OPENCODE_MENTION_INDEX=${index}
                      OPENCODE_MENTION_LENGTH=${#mention}
                    fi
                    break
                  fi
                  offset=$((index + 1))
                  remaining="${lower_body:offset}"
                done
              done
            }
            body="$(jq -r '.comment.body // empty' "${GITHUB_EVENT_PATH}")"
            opencode_find_mention "${body}" "${MENTIONS}"
            admitted=false
            if [[ "${HAS_MODEL_AND_PROMPT}" == true ]] || ((OPENCODE_MENTION_INDEX >= 0)); then
              admitted=true
            fi
          fi
          printf 'admitted=%s\n' "${admitted}" >> "${GITHUB_OUTPUT}"
  opencode-bot:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    needs: admission
    if: needs.admission.outputs.admitted == 'true'
    runs-on: ${{ inputs.runs-on || 'ubuntu-latest' }}
    steps:
      - name: Record job start time
        id: job_start
        shell: bash
        run: printf 'epoch=%s\n' "$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_TOKEN || github.token }}  # zizmor: ignore[secrets-outside-env] caller-provided secret
          persist-credentials: ${{ inputs.use-github-token }}
      - name: Configure Git identity
        if: inputs.use-github-token
        run: |
          git config --local user.name 'opencode-agent[bot]'
          git config --local user.email 'opencode-agent[bot]@users.noreply.github.com'
      - name: Run setup commands
        if: inputs.setup-commands != ''
        shell: bash
        env:
          SETUP_COMMANDS: ${{ inputs.setup-commands }}
        run: |
          eval "${SETUP_COMMANDS}"
      - name: Run OpenCode
        uses: $/.  # nosemgrep: github-actions-mutable-action-tag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        with:
          model: ${{ inputs.model }}
          models-review: ${{ inputs.models-review }}
          models-fix: ${{ inputs.models-fix }}
          guard-path-leaks: ${{ inputs.guard-path-leaks }}
          job-started-at: ${{ steps.job_start.outputs.epoch }}
          agent: ${{ inputs.agent || 'build' }}
          share: ${{ inputs.share }}
          prompt: ${{ inputs.prompt }}
          use-github-token: ${{ inputs.use-github-token }}
          mentions: ${{ inputs.mentions || '/opencode,/oc' }}
          variant: ${{ inputs.variant }}
          oidc-base-url: ${{ inputs.oidc-base-url || 'https://api.opencode.ai' }}
          opencode-version: ${{ inputs.opencode-version || 'latest' }}
          use-bundled-toolkit: ${{ inputs.model == '' || inputs.use-bundled-toolkit }}
          timeout-minutes: ${{ inputs.timeout-minutes || 60 }}
